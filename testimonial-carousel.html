<!-- Testimonial Carousel Component -->
<section class="testimonial-section section" style="background:var(--black-2);">
  <div class="container">
    <div class="text-center mb-lg reveal">
      <div class="section-label">Témoignages Clients</div>
      <h2 class="text-h1">Ce que nos clients<span class="gradient-text"> disent de nous</span></h2>
      <p class="text-body-lg mt-sm" style="max-width:560px;margin:1rem auto 0;">
        Découvrez les expériences authentiques de nos clients qui ont transformé leur business avec nos solutions IA.
      </p>
    </div>

    <div class="testimonial-carousel-container reveal">
      <div class="testimonial-track" id="testimonial-track">
        <!-- Testimonial slides will be injected here by JavaScript -->
      </div>

      <!-- Navigation -->
      <button class="testimonial-nav testimonial-nav-prev" aria-label="Témoignage précédent">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button class="testimonial-nav testimonial-nav-next" aria-label="Témoignage suivant">
        <i class="fas fa-chevron-right"></i>
      </button>

      <!-- Dots navigation -->
      <div class="testimonial-dots" id="testimonial-dots"></div>
    </div>
  </div>
</section>

<style>
  /* Testimonial Carousel Styles */
  .testimonial-section {
    position: relative;
    overflow: hidden;
    padding: 4rem 0;
  }

  .testimonial-carousel-container {
    position: relative;
    max-width: 900px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: var(--radius-xl);
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--glass-border);
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }

  .testimonial-track {
    display: flex;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
  }

  .testimonial-slide {
    min-width: 100%;
    box-sizing: border-box;
    padding: 2.5rem;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.8s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .testimonial-slide.active {
    opacity: 1;
  }

  .testimonial-content {
    max-width: 700px;
    width: 100%;
  }

  .testimonial-quote {
    font-family: var(--font-title);
    font-size: clamp(1.25rem, 2vw, 1.5rem);
    font-weight: 700;
    line-height: 1.6;
    color: var(--white);
    margin-bottom: 1.5rem;
    position: relative;
    padding: 0 1rem;
  }

  .testimonial-quote::before,
  .testimonial-quote::after {
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    font-size: 2rem;
    color: var(--grad-red);
    opacity: 0.2;
    position: absolute;
  }

  .testimonial-quote::before {
    content: "\f10d";
    top: -1rem;
    left: -0.5rem;
  }

  .testimonial-quote::after {
    content: "\f10e";
    bottom: -1rem;
    right: -0.5rem;
    rotate: 180deg;
  }

  .testimonial-author-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  .testimonial-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--grad-red);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    object-fit: cover;
  }

  .testimonial-name {
    font-family: var(--font-title);
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--white);
  }

  .testimonial-role {
    font-family: var(--font-accent);
    font-size: 0.95rem;
    color: var(--white-60);
    font-weight: 600;
  }

  .testimonial-rating {
    display: flex;
    gap: 0.25rem;
    margin-top: 1rem;
  }

  .testimonial-rating .star {
    color: var(--grad-red);
    font-size: 1.1rem;
  }

  .testimonial-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--glass-border);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 10;
    backdrop-filter: blur(5px);
  }

  .testimonial-nav:hover {
    background: rgba(255,46,46,0.15);
    border-color: rgba(255,46,46,0.3);
    transform: translateY(-50%) scale(1.1);
  }

  .testimonial-nav-prev {
    left: 1rem;
  }

  .testimonial-nav-next {
    right: 1rem;
  }

  .testimonial-dots {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-top: 1.5rem;
  }

  .testimonial-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .testimonial-dot.active {
    width: 12px;
    height: 12px;
    background: var(--grad-red);
    border-color: transparent;
    box-shadow: 0 0 8px rgba(255,46,46,0.5);
  }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    .testimonial-section {
      padding: 3rem 0;
    }

    .testimonial-carousel-container {
      margin: 0 1rem;
      border-radius: var(--radius-lg);
    }

    .testimonial-slide {
      padding: 2rem;
    }

    .testimonial-quote {
      font-size: 1.125rem;
    }

    .testimonial-avatar {
      width: 60px;
      height: 60px;
    }

    .testimonial-name {
      font-size: 1.125rem;
    }

    .testimonial-nav {
      width: 40px;
      height: 40px;
      font-size: 0.8rem;
    }

    .testimonial-nav-prev { left: 0.5rem; }
    .testimonial-nav-next { right: 0.5rem; }
  }

  @media (max-width: 480px) {
    .testimonial-quote {
      font-size: 1rem;
    }

    .testimonial-slide {
      padding: 1.5rem;
    }
  }
</style>

<script>
  // Testimonial Carousel JavaScript
  document.addEventListener('DOMContentLoaded', function() {
    const testimonials = [
      {
        id: 1,
        quote: "Hozana Concept a transformé notre approche marketing. Leur chatbot IA a augmenté nos leads qualifiés de 140% en seulement 2 mois. L'équipe est professionnelle, réactive et vraiment à l'écoute de nos besoins.",
        name: "Sophie Laurent",
        role: "Directrice Marketing, E-commerce Lyon",
        avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400&h=400&fit=crop&crop=faces",
        rating: 5
      },
      {
        id: 2,
        quote: "Nous avions des difficultés à gérer notre service client 24/7. Avec la solution d'automatisation d'Hozana, nous avons réduit nos coûts opérationnels de 60% tout en améliourant notre score de satisfaction client de 35 points.",
        name: "Karim Ben Salah",
        role: "CEO, Global SaaS Platform",
        avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400&h=400&fit=crop&crop=faces",
        rating: 5
      },
      {
        id: 3,
        quote: "La formation IA pour notre équipe a été absolument transformative. Nous sommes maintenant capables de créer nos propres automatisations et d'optimiser nos campagnes en temps réel. Meilleur investissement de l'année !",
        name: "Isabelle Dubois",
        role: "Directrice Operations, Agence Digital Paris",
        avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=400&fit=crop&crop=faces",
        rating: 5
      },
      {
        id: 4,
        quote: "Leur application mobile sur mesure a complètement révolutionné notre façon de travailler sur le terrain. Nos techniciens gagnent en moyenne 3 heures par jour grâce à l'automatisation des rapports et de la planification.",
        name: "Mohamed Ali",
        role: "CTO, Société de Services Industriels",
        avatar: "https://images.unsplash.com/photo-1502687388849-50d40353b5ee?w=400&h=400&fit=crop&crop=faces",
        rating: 4
      },
      {
        id: 5,
        quote: "Grâce à leur accompagnement stratégique, nous avons pu lever 500k€ de financement en présentant des projections basées sur leurs modèles d'IA. Leur expertise nous a donné un avantage compétitif décisif.",
        name: "Fatima Zahra",
        role: "Fondatrice, Startup Santé Maroc",
        avatar: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400&h=400&fit=crop&crop=faces",
        rating: 5
      }
    ];

    // DOM Elements
    const track = document.getElementById('testimonial-track');
    const dotsContainer = document.getElementById('testimonial-dots');
    const prevBtn = document.querySelector('.testimonial-nav-prev');
    const nextBtn = document.querySelector('.testimonial-nav-next');

    let currentIndex = 0;
    let autoPlayInterval;
    const AUTOPLAY_DELAY = 5000; // 5 seconds

    // Initialize carousel
    function initCarousel() {
      // Create slides
      testimonials.forEach((testimonial, index) => {
        const slide = document.createElement('div');
        slide.className = `testimonial-slide${index === 0 ? ' active' : ''}`;
        slide.innerHTML = `
          <div class="testimonial-content">
            <p class="testimonial-quote">${testimonial.quote}</p>
            <div class="testimonial-author-info">
              <img src="${testimonial.avatar}" alt="${testimonial.name}" class="testimonial-avatar">
              <div class="testimonial-name">${testimonial.name}</div>
              <div class="testimonial-role">${testimonial.role}</div>
            </div>
            <div class="testimonial-rating">
              ${Array(5).fill(0).map((_, i) => `
                <span class="star">${i < testimonial.rating ? '★' : '☆'}</span>
              `).join('')}
            </div>
          </div>
        `;
        track.appendChild(slide);

        // Create dot
        const dot = document.createElement('div');
        dot.className = `testimonial-dot${index === 0 ? ' active' : ''}`;
        dot.addEventListener('click', () => goToSlide(index));
        dotsContainer.appendChild(dot);
      });

      // Update slides positions
      updateSlidePositions();

      // Start autoplay
      startAutoplay();

      // Add event listeners
      prevBtn.addEventListener('click', () => {
        prevSlide();
        resetAutoplay();
      });

      nextBtn.addEventListener('click', () => {
        nextSlide();
        resetAutoplay();
      });

      // Pause on hover
      const carouselContainer = document.querySelector('.testimonial-carousel-container');
      carouselContainer.addEventListener('mouseenter', pauseAutoplay);
      carouselContainer.addEventListener('mouseleave', startAutoplay);
    }

    // Update slide positions based on current index
    function updateSlidePositions() {
      const slides = document.querySelectorAll('.testimonial-slide');
      slides.forEach((slide, index) => {
        slide.style.transform = `translateX(-${currentIndex * 100}%)`;
        slide.classList.toggle('active', index === currentIndex);
      });

      // Update dots
      const dots = document.querySelectorAll('.testimonial-dot');
      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentIndex);
      });
    }

    // Navigate to specific slide
    function goToSlide(index) {
      currentIndex = (index + testimonials.length) % testimonials.length;
      updateSlidePositions();
    }

    // Go to previous slide
    function prevSlide() {
      currentIndex = (currentIndex - 1 + testimonials.length) % testimonials.length;
      updateSlidePositions();
    }

    // Go to next slide
    function nextSlide() {
      currentIndex = (currentIndex + 1) % testimonials.length;
      updateSlidePositions();
    }

    // Autoplay functions
    function startAutoplay() {
      if (autoPlayInterval) return;
      autoPlayInterval = setInterval(nextSlide, AUTOPLAY_DELAY);
    }

    function pauseAutoplay() {
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
      }
    }

    function resetAutoplay() {
      pauseAutoplay();
      startAutoplay();
    }

    // Initialize carousel
    initCarousel();

    // Handle visibility change (pause when tab is hidden)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        pauseAutoplay();
      } else {
        startAutoplay();
      }
    });
  });
</script>

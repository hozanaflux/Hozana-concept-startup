<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail du Pack | Hozana Concept</title>
  <meta name="description" content="Détails complets et paiement sécurisé pour votre pack Hozana Concept. Automatisation IA, croissance digitale.">
  <link rel="icon" type="image/png" href="images/favicon-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Sora:wght@300;400;500;600;700;800&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/design-system.css">
  <script src="js/supabase-config.js"></script>
  <link rel="stylesheet" href="css/components.css">
  <style>
    /* CSS identical to original */
    .pack-detail-page { padding-top: var(--nav-height); min-height: 100vh; }
    .checkout-steps { display: flex; align-items: center; justify-content: center; gap: 0; padding: 2rem 1rem 0; max-width: 600px; margin: 0 auto; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 0.375rem; position: relative; flex: 1; }
    .step-number { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--glass-border); background: var(--glass-bg); display: flex; align-items: center; justify-content: center; font-family: var(--font-accent); font-size: 0.8125rem; font-weight: 700; color: var(--white-50); transition: all var(--trans-base); position: relative; z-index: 2; }
    .step.active .step-number { background: var(--grad-red); border-color: transparent; color: white; box-shadow: 0 0 20px rgba(255,46,46,0.4); }
    .step.done .step-number { background: #22c55e; border-color: transparent; color: white; }
    .step-label { font-size: 0.7rem; font-family: var(--font-accent); font-weight: 600; color: var(--white-30); letter-spacing: 0.04em; text-transform: uppercase; }
    .step.active .step-label { color: var(--red); }
    .step.done .step-label { color: #22c55e; }
    .step-line { height: 2px; flex: 1; background: var(--glass-border); margin-bottom: 1.25rem; position: relative; }
    .step-line.done { background: #22c55e; }
    .step-line.active { background: var(--grad-red); }
    .detail-wrapper { max-width: 1100px; margin: 0 auto; padding: 3rem 2rem 6rem; display: grid; grid-template-columns: 1fr 380px; gap: 2.5rem; align-items: start; }
    .checkout-screen { display: none; }
    .checkout-screen.active { display: block; }
    .pack-hero-card { background: linear-gradient(135deg, rgba(255,46,46,0.08), rgba(255,106,0,0.04)); border: 1px solid rgba(255,46,46,0.2); border-radius: var(--radius-xl); padding: 2.5rem; margin-bottom: 2rem; position: relative; overflow: hidden; }
    .pack-hero-card::before { content: ''; position: absolute; top: -60px; right: -60px; width: 220px; height: 220px; background: radial-gradient(circle, rgba(255,46,46,0.15), transparent 60%); pointer-events: none; }
    .pack-hero-title { font-family: var(--font-title); font-size: 2.25rem; font-weight: 800; margin-bottom: 0.5rem; }
    .pack-hero-subtitle { color: var(--white-50); font-size: 0.9375rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .pack-hero-price { font-family: var(--font-title); font-weight: 800; }
    .pack-price-amount { font-size: 3.5rem; line-height: 1; }
    .pack-price-period { font-size: 0.875rem; color: var(--white-40); font-weight: 400; margin-left: 0.25rem; }
    .feature-group { margin-bottom: 2rem; }
    .feature-group-title { font-family: var(--font-accent); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--red); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .feature-group-title::after { content: ''; flex: 1; height: 1px; background: rgba(255,46,46,0.2); }
    .feature-list-detailed { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }
    .feature-list-detailed li { display: flex; align-items: flex-start; gap: 0.875rem; font-size: 0.9375rem; color: var(--white-80); line-height: 1.5; }
    .feature-list-detailed li .feat-icon { width: 22px; height: 22px; border-radius: 50%; background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 0.1rem; font-size: 0.625rem; color: #22c55e; }
    .feature-list-detailed li .feat-icon.red { background: rgba(255,46,46,0.1); border-color: rgba(255,46,46,0.25); color: var(--red); }
    .feature-list-detailed li strong { color: var(--white); display: block; margin-bottom: 0.125rem; }
    .feature-list-detailed li span { font-size: 0.8125rem; color: var(--white-50); }
    .timeline { position: relative; padding-left: 2rem; }
    .timeline::before { content: ''; position: absolute; left: 10px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(180deg, var(--red) 0%, transparent 100%); }
    .timeline-item { position: relative; margin-bottom: 1.5rem; }
    .timeline-item::before { content: ''; position: absolute; left: -1.6rem; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--grad-red); box-shadow: 0 0 10px rgba(255,46,46,0.4); }
    .timeline-week { font-size: 0.7rem; font-family: var(--font-accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--red); margin-bottom: 0.25rem; }
    .timeline-title { font-family: var(--font-accent); font-weight: 700; font-size: 0.9375rem; color: var(--white); margin-bottom: 0.25rem; }
    .timeline-desc { font-size: 0.8125rem; color: var(--white-50); line-height: 1.5; }
    .mini-testimonial { background: var(--glass-bg); border: 1px solid var(--glass-border); border-left: 3px solid var(--red); border-radius: var(--radius-md); padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
    .mini-testimonial p { font-size: 0.9rem; color: var(--white-70); line-height: 1.6; font-style: italic; margin-bottom: 0.75rem; }
    .mini-testimonial-author { display: flex; align-items: center; gap: 0.75rem; }
    .mini-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--grad-red); display: flex; align-items: center; justify-content: center; font-size: 0.875rem; font-weight: 700; }
    .mini-author-info strong { display: block; font-size: 0.875rem; color: var(--white); font-family: var(--font-accent); }
    .mini-author-info span { font-size: 0.75rem; color: var(--white-50); }
    .stars { color: #FBBF24; font-size: 0.8rem; letter-spacing: 1px; }
    .order-summary { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-xl); padding: 2rem; position: sticky; top: 100px; backdrop-filter: blur(20px); }
    .order-summary h3 { font-family: var(--font-title); font-size: 1.1rem; font-weight: 700; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--glass-border); }
    .order-line { display: flex; justify-content: space-between; align-items: center; padding: 0.625rem 0; font-size: 0.875rem; color: var(--white-70); }
    .order-line.total { border-top: 1px solid var(--glass-border); margin-top: 0.5rem; padding-top: 1rem; font-weight: 700; font-size: 1rem; color: var(--white); }
    .order-line .price-tag { font-family: var(--font-accent); font-weight: 700; color: var(--white); }
    .order-line.total .price-tag { font-size: 1.25rem; color: var(--red); }
    .discount-badge { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; font-family: var(--font-accent); }
    .cta-checkout-btn { width: 100%; justify-content: center; margin-top: 1.25rem; font-size: 1rem; padding: 0.875rem; }
    .secure-badges { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1rem; font-size: 0.72rem; color: var(--white-40); font-family: var(--font-accent); }
    .money-back { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); border-radius: var(--radius-md); padding: 0.875rem 1rem; margin-top: 1rem; display: flex; align-items: flex-start; gap: 0.75rem; font-size: 0.8125rem; color: #4ade80; line-height: 1.5; }
    .billing-selector { display: flex; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-full); padding: 0.25rem; gap: 0.25rem; margin-bottom: 1.25rem; }
    .billing-opt { flex: 1; padding: 0.5rem; border-radius: var(--radius-full); border: none; background: transparent; color: var(--white-50); font-family: var(--font-accent); font-size: 0.8125rem; font-weight: 600; cursor: pointer; transition: all var(--trans-base); text-align: center; }
    .billing-opt.active { background: var(--grad-red); color: white; }
    .checkout-form-section { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-xl); padding: 2rem; margin-bottom: 1.5rem; }
    .checkout-form-section h3 { font-family: var(--font-accent); font-size: 0.875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--white-50); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
    .form-control { width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: var(--radius-md); color: var(--white); font-family: var(--font-body); font-size: 0.9375rem; outline: none; }
    .stripe-payment-box { background: linear-gradient(135deg, rgba(99,91,255,0.08), rgba(99,91,255,0.02)); border: 1px solid rgba(99,91,255,0.25); border-radius: var(--radius-xl); padding: 2rem; margin-bottom: 1.5rem; }
    .pm-tab { flex: 1; padding: 0.625rem; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--white-50); font-family: var(--font-accent); font-weight: 600; }
    .pm-tab.active { border-color: rgba(99,91,255,0.5); background: rgba(99,91,255,0.08); color: #8b85ff; }
    .success-screen { text-align: center; padding: 4rem 2rem; }
    .success-icon { width: 100px; height: 100px; border-radius: 50%; background: rgba(34,197,94,0.15); border: 2px solid rgba(34,197,94,0.4); display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 2rem; }
    @media (max-width: 900px) { .detail-wrapper { grid-template-columns: 1fr; } .order-summary { position: static; order: -1; } }
  </style>
</head>
<body>

<div id="loader">
  <img src="images/favicon-logo.png" alt="Hozana" style="width:60px;height:60px;object-fit:contain;margin-bottom:0.5rem;">
  <div class="loader-bar"><div class="loader-bar-fill"></div></div>
</div>

<div id="navbar-placeholder"></div>

<main class="pack-detail-page">
  <div class="checkout-steps" id="checkout-steps-bar">
    <div class="step done" id="step-indicator-1"><div class="step-number"><i class="fas fa-check" style="font-size:0.7rem;"></i></div><div class="step-label">Pack</div></div>
    <div class="step-line done" id="step-line-1"></div>
    <div class="step active" id="step-indicator-2"><div class="step-number">2</div><div class="step-label">Infos</div></div>
    <div class="step-line" id="step-line-2"></div>
    <div class="step" id="step-indicator-3"><div class="step-number">3</div><div class="step-label">Paiement</div></div>
    <div class="step-line" id="step-line-3"></div>
    <div class="step" id="step-indicator-4"><div class="step-number">4</div><div class="step-label">Confirmé</div></div>
  </div>

  <div class="detail-wrapper">
    <div class="left-col">
      <!-- SCREEN 1 -->
      <div class="checkout-screen active" id="screen-details">
        <div class="pack-hero-card" id="pack-hero-display"></div>
        <div id="feature-groups-display"></div>
        <div class="checkout-nav">
          <a href="packs.html" class="btn-back"><i class="fas fa-arrow-left"></i> Voir tous les packs</a>
          <button class="btn btn-primary btn-next" onclick="goToStep(2)">Continuer <i class="fas fa-arrow-right"></i></button>
        </div>
      </div>

      <!-- SCREEN 2 -->
      <div class="checkout-screen" id="screen-info">
        <form onsubmit="validateInfoAndNext(event)">
          <div class="checkout-form-section">
            <h3><i class="fas fa-user"></i> Identité</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
              <input type="text" class="form-control" id="f-firstname" placeholder="Prénom" required>
              <input type="text" class="form-control" id="f-lastname" placeholder="Nom" required>
            </div>
            <input type="email" class="form-control" id="f-email" placeholder="Email pro" style="margin-top:1rem;" required>
          </div>
          <div class="checkout-form-section">
            <h3><i class="fas fa-building"></i> Entreprise</h3>
            <input type="text" class="form-control" id="f-company" placeholder="Nom Entreprise" required>
          </div>
          <div class="checkout-nav">
            <button type="button" class="btn-back" onclick="goToStep(1)">Retour</button>
            <button type="submit" class="btn btn-primary btn-next">Paiement <i class="fas fa-lock"></i></button>
          </div>
        </form>
      </div>

      <!-- SCREEN 3 -->
      <div class="checkout-screen" id="screen-payment">
        <div class="stripe-payment-box">
          <div class="stripe-logo">stripe</div>
          <div style="margin-top:1.5rem;">
            <input type="text" class="form-control" placeholder="Numéro de carte" style="margin-bottom:1rem;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
              <input type="text" class="form-control" placeholder="MM/AA">
              <input type="text" class="form-control" placeholder="CVC">
            </div>
          </div>
        </div>
        <div class="checkout-nav">
          <button class="btn-back" onclick="goToStep(2)">Retour</button>
          <button class="btn btn-primary btn-next" onclick="processPayment()">Payer maintenant</button>
        </div>
      </div>

      <!-- SCREEN 4 -->
      <div class="checkout-screen" id="screen-success">
        <div class="success-screen">
          <div class="success-icon">✅</div>
          <h2>Commande confirmée !</h2>
          <p>Merci pour votre confiance. Nous vous contactons sous 24h.</p>
          <a href="index.html" class="btn btn-primary" style="margin-top:2rem;">Retour à l'accueil</a>
        </div>
      </div>
    </div>

    <aside>
      <div class="order-summary">
        <h3>📦 Récapitulatif</h3>
        <div class="billing-selector">
          <button class="billing-opt active" onclick="setBilling('monthly',this)">Mensuel</button>
          <button class="billing-opt" onclick="setBilling('annual',this)">Annuel</button>
        </div>
        <div class="order-line"><span id="sum-name">Pack</span><span class="price-tag" id="sum-price">0€</span></div>
        <div class="order-line total"><span>Total TTC</span><span class="price-tag" id="sum-total">0€</span></div>
        <button class="btn btn-primary w-full mt-lg" onclick="goToStep(currentStep+1)">Continuer</button>
      </div>
    </aside>
  </div>
</main>

<div id="footer-placeholder"></div>
<script src="js/core.js"></script>
<script src="js/components.js"></script>
<script>
  let pack = null;
  let billing = 'monthly';
  let currentStep = 1;

  async function init() {
    const slug = new URLSearchParams(location.search).get('pack') || 'growth';
    try {
      const res = await fetch(`tables/packs?slug=eq.${slug}`);
      const data = await res.json();
      pack = data.data?.[0] || data; // handle both array and object
      if (!pack || pack.length===0) {
        // Fallback to demo data if not in DB
        pack = { name:'Pack Growth', price_monthly:990, price_annual:792, description:'Pack standard', features:['Feature 1','Feature 2'] };
      }
      render();
    } catch(e) { console.error(e); }
  }

  function render() {
    if (!pack) return;
    const price = billing==='monthly' ? pack.price_monthly : pack.price_annual;
    document.getElementById('pack-hero-display').innerHTML = `
      <h1 class="pack-hero-title">${pack.name}</h1>
      <p class="pack-hero-subtitle">${pack.description || ''}</p>
      <div class="pack-hero-price"><span class="pack-price-amount gradient-text">${price}€</span><span class="pack-price-period">/mois HT</span></div>
    `;
    const feats = Array.isArray(pack.features) ? pack.features : (pack.features||'').split('\n').filter(Boolean);
    document.getElementById('feature-groups-display').innerHTML = `
      <div class="feature-group"><div class="feature-group-title">Inclus dans le pack</div>
      <ul class="feature-list-detailed">${feats.map(f=>`<li><div class="feat-icon"><i class="fas fa-check"></i></div><div><strong>${f}</strong></div></li>`).join('')}</ul></div>
    `;
    document.getElementById('sum-name').textContent = pack.name;
    document.getElementById('sum-price').textContent = price + '€';
    const total = Math.round(price * 1.2);
    document.getElementById('sum-total').textContent = total + '€';
  }

  function setBilling(type, btn) {
    billing = type;
    document.querySelectorAll('.billing-opt').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function goToStep(s) {
    if (s > 4) return;
    currentStep = s;
    document.querySelectorAll('.checkout-screen').forEach(el=>el.classList.remove('active'));
    const id = ['','details','info','payment','success'][s];
    document.getElementById('screen-'+id).classList.add('active');
    updateStepBar(s);
  }

  function updateStepBar(s) {
    for(let i=1;i<=4;i++) {
      const el = document.getElementById('step-indicator-'+i);
      if(!el) continue;
      el.className = 'step ' + (i<s?'done':i===s?'active':'');
    }
  }

  function validateInfoAndNext(e) { e.preventDefault(); goToStep(3); }

  async function processPayment() {
    // Save order
    const amount = parseInt(document.getElementById('sum-total').textContent);
    await fetch('tables/orders', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        pack: pack.name,
        billing: billing,
        email: document.getElementById('f-email').value,
        firstname: document.getElementById('f-firstname').value,
        lastname: document.getElementById('f-lastname').value,
        company: document.getElementById('f-company').value,
        status: 'paid',
        amount: amount
      })
    });
    goToStep(4);
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

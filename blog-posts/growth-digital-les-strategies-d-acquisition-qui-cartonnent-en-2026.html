<!DOCTYPE html><html lang="fr" data-theme="dark"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Growth Digital : Les Stratégies d'Acquisition qui Cartonnent en 2026 | Hozana Concept Blog</title>
  <meta name="description" id="page-desc" content="Découvrez les stratégies de growth digital les plus efficaces en 2026 : acquisition automatisée, optimisation de la conversion, rétention client et personnalisation à l'ère de l'IA.">
  <link rel="icon" type="image/png" href="images/favicon-logo.png">

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Sora:wght@300;400;500;600;700;800&amp;family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/design-system.css">
  <script src="js/supabase-config.js"></script>
  <link rel="stylesheet" href="css/components.css">
  <style>
    /* ---- READING PROGRESS BAR (premium) ---- */
    #reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      width: 0%;
      background: var(--grad-red);
      z-index: 99999;
      transition: width 0.1s linear;
      box-shadow: 0 0 12px rgba(255,46,46,0.6), 0 0 24px rgba(255,46,46,0.2);
    }

    /* ---- ARTICLE HERO (premium redesign) ---- */
    .article-hero {
      position: relative;
      min-height: 85vh;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      isolation: isolate;
    }
    .article-cover-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease-out;
      will-change: transform;
    }
    .article-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(11,11,11,0.15) 0%,
        rgba(11,11,11,0.35) 30%,
        rgba(11,11,11,0.75) 55%,
        rgba(11,11,11,0.95) 80%,
        rgba(11,11,11,1) 100%
      );
    }
    .article-hero-glow {
      position: absolute;
      bottom: -120px; left: 50%;
      transform: translateX(-50%);
      width: 800px; height: 300px;
      background: radial-gradient(ellipse, rgba(255,46,46,0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .article-hero-grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: linear-gradient(to bottom, black 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .article-hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: calc(var(--nav-height) + 2rem) 2rem 5rem;
    }
    .article-hero-content .hero-badge-wrap {
      display: flex;
      gap: 0.625rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      animation: fadeInUp 0.8s ease 0.1s both;
    }
    .article-hero-content .hero-cat-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem 1rem;
      background: rgba(255,46,46,0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,46,46,0.25);
      border-radius: 999px;
      font-family: var(--font-accent);
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: #FF7070;
    }
    .article-hero-content .hero-featured-badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.4rem 0.875rem;
      background: rgba(255,180,0,0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,180,0,0.2);
      border-radius: 999px;
      font-family: var(--font-accent);
      font-size: 0.7rem; font-weight: 700;
      color: #FFC107;
    }
    .article-hero-content .article-title {
      font-size: clamp(2.2rem, 4.5vw, 3.75rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: #fff;
      margin-bottom: 1.5rem;
      text-shadow: 0 2px 30px rgba(0,0,0,0.4);
      animation: fadeInUp 0.8s ease 0.2s both;
    }
    .article-meta-row {
      display: flex; align-items: center; gap: 1.5rem;
      flex-wrap: wrap;
      color: rgba(255,255,255,0.65);
      font-family: var(--font-accent);
      font-size: 0.85rem;
      animation: fadeInUp 0.8s ease 0.35s both;
    }
    .article-meta-row .meta-author {
      display: flex; align-items: center; gap: 0.625rem;
    }
    .article-meta-row .meta-author-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--grad-red);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700; color: white;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255,46,46,0.3), 0 0 20px rgba(255,46,46,0.2);
    }
    .article-meta-row .meta-item {
      display: flex; align-items: center; gap: 0.4rem;
    }
    .article-meta-row .meta-item i { color: var(--red); font-size: 0.75rem; }

    /* Breadcrumb */
    .article-breadcrumb {
      display: flex; align-items: center; gap: 0.5rem;
      font-family: var(--font-accent);
      font-size: 0.78rem;
      color: rgba(255,255,255,0.5);
      margin-bottom: 1.5rem;
      animation: fadeInUp 0.8s ease 0s both;
    }
    .article-breadcrumb a { color: rgba(255,255,255,0.5); text-decoration: none; transition: color 0.2s; }
    .article-breadcrumb a:hover { color: var(--red-light); }
    .article-breadcrumb .sep { color: rgba(255,255,255,0.2); }

    /* ---- ARTICLE LAYOUT ---- */
    .article-page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 6rem;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 4rem;
      align-items: start;
    }

    /* ---- ARTICLE BODY (premium typography) ---- */
    .article-content {
      min-width: 0;
    }
    .article-body {
      font-family: var(--font-body);
      font-size: 1.125rem;
      line-height: 1.9;
      color: var(--white-80);
    }
    .article-body p { margin-bottom: 1.75rem; }

    .article-body h2 {
      font-family: var(--font-title);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--white);
      margin: 3.5rem 0 1.25rem;
      letter-spacing: -0.02em;
      line-height: 1.2;
      padding-top: 0.75rem;
      border-top: 1px solid var(--glass-border);
      position: relative;
    }
    .article-body h2::before {
      content: '';
      position: absolute;
      top: -1px; left: 0;
      width: 60px; height: 2px;
      background: var(--grad-red);
      border-radius: 2px;
    }
    .article-body h3 {
      font-family: var(--font-title);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--white);
      margin: 2.5rem 0 1rem;
      letter-spacing: -0.01em;
    }

    /* Drop cap on first paragraph */
    .article-body > p:first-child::first-letter {
      font-size: 3.5em;
      font-weight: 800;
      float: left;
      line-height: 0.85;
      margin-right: 0.5rem;
      margin-top: 0.15rem;
      background: var(--grad-red);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-family: var(--font-title);
    }

    .article-body a {
      color: var(--red-light);
      text-decoration: underline;
      text-decoration-color: rgba(255,85,85,0.3);
      text-underline-offset: 3px;
      transition: all var(--trans-fast);
    }
    .article-body a:hover {
      color: var(--red);
      text-decoration-color: var(--red);
      text-underline-offset: 2px;
    }

    .article-body strong { color: var(--white); font-weight: 700; }

    /* Premium blockquote */
    .article-body blockquote {
      margin: 3rem 0;
      padding: 2rem 2rem 2rem 3rem;
      background: linear-gradient(135deg, rgba(255,46,46,0.06), rgba(255,106,0,0.03));
      border: none;
      border-left: 4px solid var(--red);
      border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
      font-style: italic;
      color: var(--white-70);
      font-size: 1.1rem;
      line-height: 1.8;
      position: relative;
    }
    .article-body blockquote::before {
      content: '“';
      font-family: Georgia, serif;
      font-size: 5rem;
      color: rgba(255,46,46,0.1);
      position: absolute;
      top: 0.5rem;
      left: 1rem;
      line-height: 1;
      pointer-events: none;
    }
    .article-body blockquote p:last-child { margin-bottom: 0; }

    /* Lists */
    .article-body ul, .article-body ol {
      padding-left: 1.5rem;
      margin-bottom: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }
    .article-body li::marker {
      color: var(--red);
    }
    .article-body ul li { padding-left: 0.25rem; }

    /* Inline code */
    .article-body code {
      font-family: 'Roboto Mono', 'Courier New', monospace;
      font-size: 0.85rem;
      background: rgba(255,46,46,0.08);
      border: 1px solid rgba(255,46,46,0.15);
      border-radius: 6px;
      padding: 0.15rem 0.5rem;
      color: #FF9090;
    }

    /* Code block with copy button */
    .article-body pre {
      position: relative;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 1.75rem;
      overflow-x: auto;
      margin-bottom: 1.75rem;
    }
    .article-body pre::before {
      content: '‾';
      display: block;
      margin-bottom: 0.75rem;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--white-20);
    }
    .article-body pre code {
      background: none;
      border: none;
      padding: 0;
      color: var(--white-80);
      font-size: 0.875rem;
      line-height: 1.7;
    }
    .copy-code-btn {
      position: absolute;
      top: 0.75rem; right: 0.75rem;
      padding: 0.3rem 0.625rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: rgba(255,255,255,0.4);
      font-size: 0.72rem;
      font-family: var(--font-accent);
      cursor: pointer;
      transition: all 0.2s;
      opacity: 0;
    }
    .article-body pre:hover .copy-code-btn { opacity: 1; }
    .copy-code-btn:hover {
      background: rgba(255,46,46,0.15);
      border-color: rgba(255,46,46,0.3);
      color: #FF7070;
    }

    /* Images */
    .article-body img {
      width: 100%;
      border-radius: var(--radius-lg);
      margin: 2rem 0;
      cursor: zoom-in;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .article-body img:hover {
      transform: scale(1.005);
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    .article-body hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
      margin: 3.5rem 0;
    }

    /* Premium callout boxes */
    .callout {
      padding: 1.5rem 1.75rem;
      border-radius: var(--radius-md);
      margin: 2.5rem 0;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      position: relative;
    }
    .callout-tip {
      background: linear-gradient(135deg, rgba(255,46,46,0.06), rgba(255,106,0,0.03));
      border: 1px solid rgba(255,46,46,0.18);
    }
    .callout-tip::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 3px;
      background: var(--grad-red);
      border-radius: 3px 0 0 3px;
    }
    .callout-warning {
      background: rgba(255,106,0,0.07);
      border: 1px solid rgba(255,106,0,0.2);
    }
    .callout-warning::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, #FF8C42, #FF6A00);
      border-radius: 3px 0 0 3px;
    }
    .callout-info {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .callout-info::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1));
      border-radius: 3px 0 0 3px;
    }
    .callout-icon { font-size: 1.35rem; flex-shrink: 0; margin-top: 0.1rem; }
    .callout-text { font-size: 0.9375rem; color: var(--white-80); line-height: 1.65; }

    /* ---- TABLE OF CONTENTS (premium) ---- */
    .toc-box {
      background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,46,46,0.02));
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 1.75rem;
      margin-bottom: 3rem;
    }
    .toc-title {
      font-family: var(--font-accent);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--white-40);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .toc-title i { color: var(--red); font-size: 0.85rem; }
    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      counter-reset: toc;
    }
    .toc-item {
      counter-increment: toc;
    }
    .toc-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.875rem;
      color: var(--white-60);
      text-decoration: none;
      padding: 0.5rem 0.625rem;
      border-radius: var(--radius-sm);
      transition: all var(--trans-fast);
      cursor: pointer;
      border: 1px solid transparent;
    }
    .toc-link::before {
      content: counter(toc, decimal-leading-zero);
      font-family: var(--font-accent);
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--red);
      flex-shrink: 0;
      min-width: 22px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .toc-link:hover {
      color: var(--white);
      background: rgba(255,46,46,0.06);
      border-color: rgba(255,46,46,0.12);
    }
    .toc-link:hover::before { opacity: 1; }
    .toc-link.active {
      color: var(--red-light);
      background: rgba(255,46,46,0.08);
      border-color: rgba(255,46,46,0.2);
    }
    .toc-link.active::before { opacity: 1; }

    /* ---- SIDEBAR (sticky) ---- */
    .article-sidebar {
      position: sticky;
      top: calc(var(--nav-height) + 2rem);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .sidebar-widget {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      transition: all var(--trans-base);
    }
    .sidebar-widget:hover {
      border-color: rgba(255,46,46,0.15);
    }
    .sidebar-widget-title {
      font-family: var(--font-accent);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--white-40);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sidebar-widget-title i { color: var(--red); }

    /* Share buttons */
    .share-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }
    .share-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      text-decoration: none;
      font-family: var(--font-accent);
      font-size: 0.8125rem;
      font-weight: 600;
      transition: all var(--trans-fast);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--white-70);
      cursor: pointer;
    }
    .share-btn:hover { transform: translateX(4px); border-color: transparent; }
    .share-btn.twitter:hover  { background: #1DA1F2; color: white; border-color: #1DA1F2; }
    .share-btn.linkedin:hover { background: #0A66C2; color: white; border-color: #0A66C2; }
    .share-btn.copy:hover     { background: rgba(255,46,46,0.1); color: var(--red); }
    .share-btn.whatsapp:hover { background: #25D366; color: white; border-color: #25D366; }

    /* Like button */
    .like-section {
      text-align: center;
      padding: 2rem;
      background: linear-gradient(135deg, rgba(255,46,46,0.03), transparent);
      border: 1px solid rgba(255,46,46,0.08);
      border-radius: var(--radius-xl);
    }
    .like-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.875rem 2rem;
      background: rgba(255,46,46,0.06);
      border: 1.5px solid rgba(255,46,46,0.2);
      border-radius: var(--radius-full);
      color: var(--white-70);
      font-family: var(--font-accent);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--trans-bounce);
    }
    .like-btn:hover:not(.liked) {
      background: rgba(255,46,46,0.12);
      border-color: rgba(255,46,46,0.4);
      transform: scale(1.04);
      box-shadow: 0 0 20px rgba(255,46,46,0.15);
    }
    .like-btn.liked {
      background: rgba(255,46,46,0.15);
      border-color: var(--red);
      color: var(--red-light);
      box-shadow: 0 0 20px rgba(255,46,46,0.2);
    }
    .like-btn .like-heart {
      font-size: 1.1rem;
      transition: transform var(--trans-bounce);
    }
    .like-btn:hover .like-heart { transform: scale(1.3); }
    .like-btn.liked .like-heart { animation: heartPop 0.4s ease; }
    @keyframes heartPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.4); }
      100% { transform: scale(1.15); }
    }

    /* ---- COMMENTS (premium) ---- */
    .comments-section {
      margin-top: 4rem;
      padding-top: 3rem;
      border-top: 1px solid var(--glass-border);
    }
    .comment-item {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--glass-border);
      transition: background 0.2s;
      border-radius: var(--radius-md);
      padding: 1rem;
      margin-left: -1rem;
      margin-right: -1rem;
    }
    .comment-item:hover { background: rgba(255,255,255,0.02); }
    .comment-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 1rem;
    }
    .comment-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--grad-red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.875rem;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255,46,46,0.2), 0 0 15px rgba(255,46,46,0.1);
    }
    .comment-body { flex: 1; min-width: 0; }
    .comment-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .comment-author {
      font-family: var(--font-accent);
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--white);
    }
    .comment-date {
      font-size: 0.75rem;
      color: var(--white-30);
      font-family: var(--font-accent);
    }
    .comment-text {
      font-size: 0.9375rem;
      color: var(--white-70);
      line-height: 1.65;
    }
    .comment-form {
      margin-top: 2rem;
      background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,46,46,0.02));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 2rem;
      position: relative;
    }
    .comment-form::before {
      content: '';
      position: absolute;
      top: 0; left: 2rem; right: 2rem;
      height: 1px;
      background: var(--grad-red);
      opacity: 0.3;
    }
    .comment-form h3 {
      font-family: var(--font-title);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      color: var(--white);
    }
    .comment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    /* ---- RELATED ARTICLES (premium) ---- */
    .related-section {
      padding: 5rem 2rem;
      background: var(--black-2);
      position: relative;
      overflow: hidden;
    }
    .related-section::before {
      content: '';
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 500px; height: 1px;
      background: var(--grad-red);
      opacity: 0.3;
    }
    .related-grid-wrapper {
      max-width: 1200px;
      margin: 2rem auto 0;
    }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }
    .related-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: all var(--trans-base);
      display: flex;
      flex-direction: column;
    }
    .related-card:hover {
      border-color: rgba(255,46,46,0.25);
      transform: translateY(-6px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }
    .related-img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .related-card:hover .related-img { transform: scale(1.06); }
    .related-body {
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .related-cat {
      font-size: 0.7rem;
      font-family: var(--font-accent);
      font-weight: 700;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.625rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .related-cat::before {
      content: '';
      width: 12px; height: 2px;
      background: var(--grad-red);
      border-radius: 2px;
    }
    .related-title {
      font-family: var(--font-title);
      font-size: 1rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1.35;
      margin-bottom: auto;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.2s;
    }
    .related-card:hover .related-title { color: #FF7070; }
    .related-meta {
      margin-top: 1rem;
      padding-top: 0.875rem;
      border-top: 1px solid var(--glass-border);
      font-size: 0.75rem;
      color: var(--white-35);
      font-family: var(--font-accent);
      display: flex;
      gap: 0.75rem;
    }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .article-page-wrap { grid-template-columns: 1fr; gap: 2rem; }
      .article-sidebar { position: static; }
      .comment-grid { grid-template-columns: 1fr; }
      .related-grid { grid-template-columns: 1fr 1fr; }
      .article-hero { min-height: 65vh; }
      .article-title { font-size: clamp(1.8rem, 5vw, 3rem) !important; }
    }
    @media (max-width: 768px) {
      .article-hero { min-height: 50vh; }
      .article-hero-content { padding: calc(var(--nav-height) + 1rem) 1.25rem 3rem; }
      .article-page-wrap { padding: 0 1.25rem 4rem; }
      .related-section { padding: 3rem 1.25rem; }
      .related-grid { grid-template-columns: 1fr; gap: 1.25rem; }
      .share-buttons { flex-direction: row; flex-wrap: wrap; }
      .share-btn { flex: 1; min-width: 120px; justify-content: center; }
      .article-title { font-size: clamp(1.5rem, 6vw, 2.2rem) !important; }
      .article-meta-row { font-size: 0.78rem; gap: 1rem; }
      .article-body { font-size: 1rem; line-height: 1.8; }
      .article-body h2 { font-size: 1.35rem; }
      .article-body > p:first-child::first-letter { font-size: 2.5em; }
      .comment-item { margin-left: 0; margin-right: 0; padding: 0.75rem; }
      .article-hero-glow { width: 100%; }
    }
    @media (max-width: 480px) {
      .article-hero { min-height: 45vh; }
      .article-title { font-size: 1.35rem !important; }
      .article-meta-row .meta-item { font-size: 0.72rem; }
      .article-hero-content .hero-badge-wrap { gap: 0.375rem; }
      .article-meta-row { gap: 0.75rem; }
    }

    /* Related card entrance */
    .related-card { opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.3s, box-shadow 0.3s; }
    .related-card.visible { opacity: 1; transform: translateY(0); }

    /* ---- FLOATING SHARE BAR (premium) ---- */
    .floating-share {
      position: fixed;
      left: 2rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 50;
      opacity: 0;
      visibility: hidden;
      transition: all 0.5s ease;
    }
    .floating-share.visible { opacity: 1; visibility: visible; }
    .floating-share-line {
      width: 1px;
      height: 40px;
      background: linear-gradient(180deg, var(--glass-border), transparent);
      margin: 0 auto 0.25rem;
    }
    .floating-share-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--white-50);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all var(--trans-bounce);
    }
    .floating-share-btn:hover { transform: scale(1.12); color: white; border-color: transparent; }
    .floating-share-btn.fb-twitter:hover { background: #1DA1F2; }
    .floating-share-btn.fb-linkedin:hover { background: #0A66C2; }
    .floating-share-btn.fb-copy:hover { background: rgba(255,46,46,0.15); color: var(--red); border-color: rgba(255,46,46,0.3); }

    /* ---- BACK TO TOP ---- */
    .back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      color: var(--white-50);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      z-index: 50;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all var(--trans-bounce);
      box-shadow: var(--shadow-md);
    }
    .back-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
    .back-to-top:hover {
      background: rgba(255,46,46,0.12);
      border-color: rgba(255,46,46,0.3);
      color: var(--red);
      transform: translateY(-4px);
      box-shadow: var(--shadow-red-sm);
    }

    /* ---- READING TIME REMAINING ---- */
    .reading-time-remaining {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      padding: 0.5rem 1rem;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      font-family: var(--font-accent);
      font-size: 0.75rem;
      color: var(--white-50);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
    }
    .reading-time-remaining.visible { opacity: 1; visibility: visible; }
    .reading-time-remaining i { color: var(--red); font-size: 0.7rem; }

    /* ---- LIGHTBOX ---- */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(20px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
      cursor: zoom-out;
    }
    .lightbox-overlay.open { opacity: 1; visibility: visible; }
    .lightbox-overlay img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: var(--radius-lg);
      box-shadow: 0 40px 120px rgba(0,0,0,0.8);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .lightbox-overlay.open img { transform: scale(1); }
    .lightbox-close {
      position: absolute;
      top: 2rem; right: 2rem;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .lightbox-close:hover {
      background: rgba(255,46,46,0.2);
      border-color: rgba(255,46,46,0.4);
      transform: scale(1.1);
    }
    .lightbox-caption {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-accent);
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      max-width: 80vw;
      text-align: center;
    }

    /* ---- SCROLL CONTENT ANIMATIONS ---- */
    .article-body > * {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .article-body > *.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Sidebar widget entrance */
    .article-sidebar .sidebar-widget { transition: opacity 0.5s ease, transform 0.5s ease; }

    /* ---- HERO PARALLAX (mouse tracking) ---- */
    @media (hover: hover) {
      .article-cover-img.parallax-active {
        transition: transform 0.08s ease-out;
      }
    }

    /* ---- RESPONSIVE OVERRIDES ---- */
    @media (max-width: 1200px) {
      .floating-share { display: none; }
    }
    @media (max-width: 768px) {
      .back-to-top { bottom: 1.25rem; right: 1.25rem; width: 42px; height: 42px; }
      .reading-time-remaining { display: none; }
      .article-body > * { transform: none; opacity: 1; }
    }
</head>

<script>
'use strict';

let currentPost = null;
let allComments = [];
let postId = null;

/* ====================================================
   INIT
   ==================================================== */
document.addEventListener('DOMContentLoaded', async () => {
  // Check for static blog data (pre-rendered pages) or URL parameter
  if (window.__STATIC_BLOG_DATA__ && window.__STATIC_BLOG_DATA__.id) {
    postId = window.__STATIC_BLOG_DATA__.id;
    currentPost = window.__STATIC_BLOG_DATA__;
    // Static page — content already rendered. Enable interactive features.
    initReadingProgress();
    initScrollAnimations();
    initScrollUI();
    initParallaxHero();
    loadComments();
    trackView();
    // Load related articles from Supabase
    loadRelatedForStatic();
    return;
  }

  const params = new URLSearchParams(window.location.search);
  postId = params.get('id');

  if (!postId) {
    showError('Article introuvable', 'Aucun identifiant d\'article fourni.');
    return;
  }

/* ====================================================
   LOAD POST
   ==================================================== */
async function loadPost() {
  try {
    const [postRes, allRes] = await Promise.all([
      fetch(`tables/blog_posts/${postId}`),
      fetch('tables/blog_posts?limit=100')
    ]);

    if (!postRes.ok) throw new Error('Post not found');
    currentPost = await postRes.json();

    const allData = await allRes.json();
    const allPosts = allData.data || [];

    renderPost(currentPost);
    renderRelated(allPosts, currentPost);
    trackView();
  } catch(err) {
    showError('Article introuvable', 'Cet article n\'existe pas ou a été supprimé.');
  }
}

/* ====================================================
   TABLE OF CONTENTS
   ==================================================== */
function buildTOC() {
  const headings = document.querySelectorAll('.article-body h2, .article-body h3');
  if (headings.length < 2) return;

  const tocBox = document.getElementById('toc-box');
  const tocList = document.getElementById('toc-list');
  const tocSidebar = document.getElementById('toc-sidebar');
  const tocSidebarList = document.getElementById('toc-sidebar-list');

  let inlineHtml = '';
  let sidebarHtml = '';

  headings.forEach((h, i) => {
    const id = `section-${i}`;
    h.id = id;
    const isH3 = h.tagName === 'H3';
    const text = h.textContent;
    const indent = isH3 ? 'padding-left:1.25rem;' : '';

    inlineHtml += `<li class="toc-item" style="${indent}"><span class="toc-link" onclick="scrollToSection('${id}')">${escapeHtml(text)}</span></li>`;
    sidebarHtml += `<li class="toc-item" style="${indent}"><span class="toc-link" onclick="scrollToSection('${id}')" data-target="${id}">${escapeHtml(text)}</span></li>`;
  });

  if (tocBox && tocList) { tocList.innerHTML = inlineHtml; tocBox.style.display = 'block'; }
  if (tocSidebar && tocSidebarList) { tocSidebarList.innerHTML = sidebarHtml; tocSidebar.style.display = 'block'; }

  // Highlight active section
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        document.querySelectorAll('.toc-link').forEach(l => l.classList.remove('active'));
        document.querySelectorAll(`.toc-link[data-target="${e.target.id}"]`).forEach(l => l.classList.add('active'));
      }
    });
  }, { rootMargin: '-20% 0px -70% 0px' });

  headings.forEach(h => observer.observe(h));
}

function scrollToSection(id) {
  const el = document.getElementById(id);
  if (el) {
    const offset = el.getBoundingClientRect().top + window.scrollY - 100;
    window.scrollTo({ top: offset, behavior: 'smooth' });
  }
}

/* ====================================================
   READING PROGRESS
   ==================================================== */
function initReadingProgress() {
  const bar = document.getElementById('reading-progress');
  if (!bar) return;

  window.addEventListener('scroll', () => {
    const body = document.body;
    const html = document.documentElement;
    const totalH = Math.max(body.scrollHeight, html.scrollHeight) - window.innerHeight;
    const progress = totalH > 0 ? (window.scrollY / totalH) * 100 : 0;
    bar.style.width = Math.min(progress, 100) + '%';
  }, { passive: true });
}

/* ====================================================
   HERO PARALLAX — Mouse tracking
   ==================================================== */
function initParallaxHero() {
  const hero = document.getElementById('article-hero');
  const cover = document.getElementById('article-cover');
  if (!hero || !cover) return;

  if (window.matchMedia('(hover: hover)').matches) {
    cover.classList.add('parallax-active');
    hero.addEventListener('mousemove', (e) => {
      const rect = hero.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
      const y = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
      cover.style.transform = `translate(${x * 8}px, ${y * 5}px) scale(1.05)`;
    });
    hero.addEventListener('mouseleave', () => {
      cover.style.transform = 'translate(0, 0) scale(1)';
    });
  }
}

/* ====================================================
   SCROLL CONTENT ANIMATIONS
   ==================================================== */
function initScrollAnimations() {
  const body = document.getElementById('article-body');
  if (!body) return;

  // Observe each direct child of article-body
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, idx) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), idx * 40);
        observer.unobserve(entry.target);
      }
    });
  }, { rootMargin: '0px 0px -80px 0px', threshold: 0.1 });

  const children = body.querySelectorAll(':scope > *');
  children.forEach(el => observer.observe(el));
}

/* ====================================================
   SCROLL UI — floating share, back to top, reading time
   ==================================================== */
function initScrollUI() {
  const floatingShare = document.getElementById('floating-share');
  const backToTop = document.getElementById('back-to-top');
  const readingTimeEl = document.getElementById('reading-time-remaining');
  const timeText = document.getElementById('time-remaining-text');
  const bodyEl = document.getElementById('article-body');

  const totalReadTime = currentPost?.read_time || 5;
  const heroEl = document.getElementById('article-hero');
  const heroH = heroEl?.offsetHeight || 600;
  let lastPercent = -1;

  window.addEventListener('scroll', () => {
    const scrollY = window.scrollY;
    const bodyH = document.body.scrollHeight;
    const winH = window.innerHeight;
    const maxScroll = Math.max(bodyH - winH, 1);
    const percent = Math.min(scrollY / maxScroll, 1);

    // Floating share visible after hero
    floatingShare?.classList.toggle('visible', scrollY > heroH * 0.7);

    // Back to top
    backToTop?.classList.toggle('visible', scrollY > winH);

    // Reading time remaining
    if (readingTimeEl && timeText) {
      readingTimeEl.classList.toggle('visible', scrollY > 300 && scrollY < maxScroll - 200);
      const remaining = Math.max(1, Math.round(totalReadTime * (1 - percent)));
      const pct = Math.round(percent * 100);
      if (pct !== lastPercent) {
        lastPercent = pct;
        timeText.textContent = `~${remaining} min restant`;
      }
    }
  }, { passive: true });
}

}

async function toggleLike() {

  const hasLiked = localStorage.getItem(`hozana-like-${currentPost.id}`) === 'true';

/* ====================================================
   RELATED ARTICLES
   ==================================================== */
function renderRelated(allPosts, currentPost) {
  const grid = document.getElementById('related-grid');
  if (!grid) return;

  const related = allPosts
    .filter(p => p.id !== currentPost.id)
    .sort((a, b) => {
      const sameCat = (p) => (p.category === currentPost.category) ? 1 : 0;
      return sameCat(b) - sameCat(a);
    })
    .slice(0, 3);

  if (!related.length) { grid.closest('section')?.remove(); return; }

  grid.innerHTML = related.map(p => {
    const rawImg = p.cover_image || p.image || p.img || p.thumbnail || p.cover;
    const img = resolveImageURL(rawImg);
    return `
    <a href="blog-posts/${p.slug || p.id}.html" class="related-card" style="opacity:1 !important; visibility:visible !important;">
      <div style="overflow:hidden; aspect-ratio:16/9; background:#0a0a0c;">
        <img src="${img}" alt="${escapeHtml(p.title)}" class="related-img" loading="eager"
          onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1677442135703-1787eea5ce01?w=600&q=70'">
      </div>
      <div class="related-body">
        <div class="related-cat">${escapeHtml(p.category || 'IA')}</div>
        <div class="related-title">${escapeHtml(p.title)}</div>
        <div class="related-meta">
          <span><i class="fas fa-clock"></i> ${p.read_time || 5} min</span>
          <span><i class="fas fa-eye"></i> ${formatNum(p.views || 0)}</span>
          <span><i class="fas fa-heart"></i> ${formatNum(p.likes || 0)}</span>
        </div>
      </div>
    </a>`;
  }).join('');

  // Stagger entrance animation
  requestAnimationFrame(() => {
    const cards = grid.querySelectorAll('.related-card');
    cards.forEach((card, i) => {
      setTimeout(() => card.classList.add('visible'), 100 + i * 120);
    });
  });
}

function resolveImageURL(path) {
  if (!path || typeof path !== 'string') return 'https://images.unsplash.com/photo-1677442135703-1787eea5ce01?w=600&q=70';
  const p = path.trim();
  if (p.startsWith('http') || p.startsWith('data:')) return p;
  if (p.startsWith('images/')) return p;
  if (!p.includes('/')) return `images/${p}`;
  return `${SUPABASE_URL}/storage/v1/object/public/blog-images/${p}`;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch { return ''; }
}

function formatNum(n) {
  const num = parseInt(n) || 0;
  if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
  return String(num);
}
